name: Package release

on:
  release:
    types: [published]

jobs:
  package:
    name: Attach Cpanel.zip
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Package files into a Cpanel folder
        run: |
          mkdir -p build/Cpanel
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="build" \
            --exclude=".DS_Store" \
            ./ build/Cpanel/
          (
            cd build
            zip -r Cpanel.zip Cpanel
          )
          unzip -l build/Cpanel.zip

      - name: Upload zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Cpanel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
